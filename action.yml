name: 'Slop Detector'
description: 'Scores GitHub issues and pull requests for information density; posts helpful checklist comments'
author: 'Asteam Black Shadow'

inputs:
  github-token:
    description: 'GitHub token (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  dry-run:
    description: 'If true, skip posting comment and applying labels'
    required: false
    default: 'false'
  enable-comments:
    description: 'If false, skip posting the checklist comment'
    required: false
    default: 'true'
  enable-labels:
    description: 'If false, skip label management'
    required: false
    default: 'true'
  label-name:
    description: 'Name of the label to apply when checklist has items'
    required: false
    default: 'needs-info'
  pr-label-name:
    description: 'Label applied on pull requests when more reviewer context is needed'
    required: false
    default: 'needs-review-context'
  model:
    description: 'LLM model routing — auto, none, anthropic:<model>, or openai:<model> (empty = auto)'
    required: false
    default: ''
  gray-zone-low:
    description: 'Lower bound of gray zone (inclusive)'
    required: false
    default: '4'
  gray-zone-high:
    description: 'Upper bound of gray zone (inclusive)'
    required: false
    default: '6'
  max-body-bytes:
    description: 'Maximum issue body bytes to analyze (truncated before scoring)'
    required: false
    default: '10000'
  enable-tier3-llm:
    description: 'If true, the Tier-3 (CONTRIBUTING.md → LLM extraction) strategy is enabled when conditions hold; if false, the chain falls through to Tier-4 baseline.'
    required: false
    default: 'true'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'check-square'
  color: 'blue'
